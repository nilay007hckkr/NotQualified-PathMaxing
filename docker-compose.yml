# Local Postgres for development: docker compose up -d db
# The credentials are for this local container only.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pathmaxing
      POSTGRES_PASSWORD: pathmaxing
      POSTGRES_DB: pathmaxing
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathmaxing -d pathmaxing"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
