<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{.Title}} · PathMaxing</title>
<style>
:root { --bg:#f6f7f9; --card:#fff; --text:#16191f; --muted:#5b6472; --border:#dde1e7; --brand:#0f766e; --danger:#b42318; --warn:#9a5b00; --focus:#2563eb; }
@media (prefers-color-scheme: dark) { :root { --bg:#0f1216; --card:#171b21; --text:#e8ebef; --muted:#9aa4b2; --border:#2c333d; --brand:#2bb3a6; --danger:#f97066; --warn:#fdb022; --focus:#7ba7ff; } }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; display:grid; place-items:center; padding:1rem; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
main { width:100%; max-width:28rem; background:var(--card); border:1px solid var(--border); border-top:4px solid var(--brand); border-radius:10px; padding:1.75rem 1.5rem; }
main.danger { border-top-color:var(--danger); } main.warn { border-top-color:var(--warn); }
.brand { font-weight:700; color:var(--brand); margin:0 0 1rem; font-size:.95rem; }
h1 { font-size:1.35rem; margin:0 0 .5rem; line-height:1.3; }
p { margin:.25rem 0 0; color:var(--muted); }
.host { margin-top:1rem; padding:.6rem .75rem; border:1px dashed var(--border); border-radius:6px; font-family:ui-monospace,Consolas,monospace; overflow-wrap:anywhere; }
form { margin-top:1.25rem; display:grid; gap:.5rem; }
label { font-weight:600; }
input { font:inherit; color:var(--text); background:var(--card); padding:.6rem .7rem; border:1px solid var(--border); border-radius:6px; }
button { font:inherit; font-weight:600; padding:.6rem 1rem; border:0; border-radius:6px; background:var(--brand); color:#fff; cursor:pointer; }
:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
.error { color:var(--danger); margin:0; }
</style>
</head>
<body>
<main class="{{.Tone}}">
  <p class="brand">PathMaxing</p>
  <h1>{{.Heading}}</h1>
  <p>{{.Message}}</p>
  {{if .Host}}<p class="host" aria-label="Blocked destination">{{.Host}}</p>{{end}}
  {{if .Password}}
  <form method="post" action="/{{.Code}}{{if .QR}}?s=qr{{end}}">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus{{if .Error}} aria-invalid="true" aria-describedby="password-error"{{end}}>
    {{if .Error}}<p class="error" id="password-error" role="alert">{{.Error}}</p>{{end}}
    <button type="submit">Unlock</button>
  </form>
  {{end}}
</main>
</body>
</html>
