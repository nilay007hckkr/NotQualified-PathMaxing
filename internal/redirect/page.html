<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{.Title}} · PathMaxing</title>
<style>
/* PathMaxing design (based on the TemplateMo 627 HyperLuv template). The
   fonts fall back to system faces on purpose: loading web fonts here would
   tell a third party about every visitor and slow down the redirect. */
:root { --ink:#0B0B0B; --bone:#F3EFE3; --lime:#D0F53A; --orange:#FF5826; --pink:#FF3D7F; --muted:#4a463d; --bg:var(--bone); --card:#fff; --text:var(--ink); --edge:var(--ink); --focus:var(--ink); }
@media (prefers-color-scheme: dark) { :root { --bg:var(--ink); --card:#161616; --text:var(--bone); --muted:#bdb7a6; --edge:var(--bone); --focus:var(--lime); } }
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; display:grid; place-items:center; padding:1rem; background:var(--bg); color:var(--text); font:16px/1.5 "Space Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { width:100%; max-width:28rem; background:var(--card); border:3px solid var(--edge); box-shadow:6px 6px 0 var(--edge); padding:1.6rem 1.4rem; }
.brand { display:inline-block; margin:0 0 1rem; padding:2px 8px; background:var(--lime); color:var(--ink); font:600 .95rem/1.4 "VT323", ui-monospace, Consolas, monospace; letter-spacing:2px; text-transform:uppercase; }
main.warn .brand { background:var(--orange); } main.danger .brand { background:var(--pink); }
h1 { font-family:"Anton", "Arial Narrow", Impact, sans-serif; text-transform:uppercase; letter-spacing:.5px; font-size:1.7rem; line-height:1.1; margin:0 0 .6rem; }
p { margin:.25rem 0 0; color:var(--muted); }
.host { margin-top:1rem; padding:.6rem .75rem; border:3px dashed var(--edge); color:var(--text); font-family:ui-monospace, Consolas, monospace; overflow-wrap:anywhere; }
form { margin-top:1.25rem; display:grid; gap:.5rem; }
label { font-weight:600; color:var(--text); }
input { font:inherit; color:var(--text); background:var(--card); padding:.6rem .7rem; border:3px solid var(--edge); }
button { font:1.05rem/1.2 "Anton", "Arial Narrow", Impact, sans-serif; text-transform:uppercase; letter-spacing:.5px; padding:.7rem 1rem; border:3px solid var(--ink); background:var(--lime); color:var(--ink); cursor:pointer; box-shadow:4px 4px 0 var(--edge); }
a { color:var(--text); font-weight:600; }
:focus-visible { outline:3px solid var(--focus); outline-offset:3px; }
.error { color:#b0003a; margin:0; font-weight:600; }
@media (prefers-color-scheme: dark) { .error { color:var(--pink); } }
</style>
</head>
<body>
<main class="{{.Tone}}">
  <p class="brand">PathMaxing</p>
  <h1>{{.Heading}}</h1>
  <p>{{.Message}}</p>
  {{if .Host}}<p class="host" aria-label="Blocked destination">{{.Host}}</p>{{end}}
  {{if .Code}}{{if not .Password}}<p><a href="/p/{{.Code}}">See what PathMaxing knows about this link</a></p>{{end}}{{end}}
  {{if .Password}}
  <form method="post" action="/{{.Code}}{{if .QR}}?s=qr{{end}}">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus{{if .Error}} aria-invalid="true" aria-describedby="password-error"{{end}}>
    {{if .Error}}<p class="error" id="password-error" role="alert">{{.Error}}</p>{{end}}
    <button type="submit">Unlock</button>
  </form>
  {{end}}
</main>
</body>
</html>
